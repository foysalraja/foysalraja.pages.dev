<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D Moto Rider | Foysal Raja</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0b1120;
            font-family: 'Poppins', sans-serif;
            color: #fff;
            min-height: 100vh;
        }
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: #111827;
            border-bottom: 1px solid #1e293b;
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
        .logo-img { width: 40px; height: 40px; border-radius: 8px; background: #00d4ff; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }
        .nav-links { display: flex; list-style: none; gap: 25px; }
        .nav-links a { color: #94a3b8; text-decoration: none; font-weight: 400; transition: 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: #00d4ff; }
        .hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; }
        .hamburger span { width: 25px; height: 3px; background: #fff; border-radius: 3px; transition: 0.3s; }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(6px, 6px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(6px, -6px); }

        #game-container {
            position: relative;
            width: 100%;
            height: 60vh;
            max-height: 500px;
            overflow: hidden;
            border-radius: 10px;
            border: 3px solid #00d4ff;
            background: #0f172a;
        }
        canvas { display: block; width: 100%; height: 100%; }

        .game-ui {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #111827;
            border-radius: 10px;
            margin-bottom: 10px;
            border: 1px solid #1e293b;
            flex-wrap: wrap;
            gap: 8px;
        }
        .score-text { color: #fff; font-size: 1rem; font-weight: 600; }
        .score-text span { color: #00d4ff; }
        .coin-text span { color: #f59e0b; }
        .btn {
            background: #00d4ff;
            color: #0b1120;
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
        }
        .btn:hover { background: #38bdf8; transform: scale(1.03); }

        .mobile-controls {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 18px;
        }
        .ctrl-btn {
            width: 80px;
            height: 80px;
            font-size: 1.8rem;
            background: #1e293b;
            color: #00d4ff;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            cursor: pointer;
            transition: 0.1s;
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.15);
        }
        .ctrl-btn:active { background: #00d4ff; color: #0b1120; transform: scale(0.95); }

        .container {
            padding: 10px 5%;
            max-width: 700px;
            margin: 0 auto;
        }
        .back-link {
            color: #00d4ff;
            text-decoration: none;
            display: inline-block;
            margin-bottom: 12px;
            font-weight: 500;
        }
        h2 { text-align: center; margin-bottom: 15px; font-weight: 700; font-size: 1.5rem; }
        h2 span { color: #00d4ff; }

        .shop-btn {
            background: #8b5cf6;
            color: #fff;
            padding: 10px 22px;
            border-radius: 10px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 15px;
            transition: 0.2s;
            font-family: 'Poppins', sans-serif;
            display: block;
            width: 100%;
            font-size: 1rem;
        }
        .shop-btn:hover { background: #7c3aed; transform: scale(1.01); }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
            margin-bottom: 12px;
            background: #111827;
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid #1e293b;
            flex-wrap: wrap;
        }
        .mode-toggle label {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 500;
            color: #cbd5e1;
        }
        .mode-toggle input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #00d4ff;
            cursor: pointer;
        }
        .badge {
            background: #00d4ff22;
            color: #00d4ff;
            padding: 2px 10px;
            border-radius: 50px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid #00d4ff55;
        }
        .badge.gold {
            background: #f59e0b22;
            color: #f59e0b;
            border-color: #f59e0b55;
        }

        /* Coin overlay for 3D scene label */
        .coin-float {
            position: absolute;
            top: 10px;
            right: 15px;
            background: #f59e0bcc;
            color: #0b1120;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            backdrop-filter: blur(4px);
        }

        @media (max-width: 600px) {
            .nav-links {
                display: none;
                position: absolute;
                top: 70px;
                left: 0;
                width: 100%;
                background: #111827;
                flex-direction: column;
                padding: 20px;
                border-bottom: 1px solid #1e293b;
                z-index: 100;
                gap: 18px;
            }
            .nav-links.active { display: flex; }
            .hamburger { display: flex; }
            .game-ui { font-size: 0.85rem; padding: 8px 12px; }
            .score-text { font-size: 0.85rem; }
            .ctrl-btn { width: 65px; height: 65px; font-size: 1.4rem; }
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">
            <div class="logo-img">🏍️</div>
            <span>Foysal Raja</span>
        </div>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html">Home</a></li>
            <li><a href="game.html" class="active">Games</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
        <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
    </nav>

    <div class="container">
        <a href="game.html" class="back-link">← Back to Games</a>
        <h2>3D Moto Rider <span>🏍️</span></h2>

        <!-- Mode & Multiplayer toggle -->
        <div class="mode-toggle">
            <label>
                <input type="checkbox" id="pcMode" checked>
                💻 PC Mode (Keyboard)
            </label>
            <label>
                <input type="checkbox" id="multiplayerMode">
                🎮 2-Player (Friend)
            </label>
            <span class="badge">Coins: <span id="badgeCoins">0</span></span>
        </div>

        <div class="game-ui">
            <div class="score-text">Score: <span id="score">0</span></div>
            <div class="score-text coin-text">Coins: <span id="coins">0</span> 🪙</div>
            <button class="btn" onclick="startGame()" id="startBtn">Start</button>
        </div>

        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            <div class="coin-float" id="coinFloat">🪙 0</div>
        </div>

        <div class="mobile-controls">
            <div class="ctrl-btn" onmousedown="moveLeftP1()" onmouseup="stopMoveP1()" onmouseleave="stopMoveP1()" ontouchstart="moveLeftP1()" ontouchend="stopMoveP1()">⬅️</div>
            <div class="ctrl-btn" onmousedown="moveRightP1()" onmouseup="stopMoveP1()" onmouseleave="stopMoveP1()" ontouchstart="moveRightP1()" ontouchend="stopMoveP1()">➡️</div>
        </div>

        <button class="shop-btn" onclick="buyCoins()">🛒 Get 100 Coins (Free)</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        /* ---------- HAMBURGER ---------- */
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        if (hamburger && navLinks) {
            hamburger.addEventListener('click', () => {
                hamburger.classList.toggle('active');
                navLinks.classList.toggle('active');
            });
            document.querySelectorAll('.nav-links a').forEach(link => {
                link.addEventListener('click', () => {
                    hamburger.classList.remove('active');
                    navLinks.classList.remove('active');
                });
            });
        }

        /* ---------- GLOBAL VARS ---------- */
        let scene, camera, renderer, motoP1, motoP2;
        let obstacles = [], coins = [];
        let score = 0, totalCoins = 0;
        let isPlaying = false, gameInterval, dayTime = 0;
        let velocityX = 0, velocityX2 = 0;
        let currentSpeed = 0.5;
        const canvasContainer = document.getElementById('game-container');
        const canvas = document.getElementById('gameCanvas');

        // Multiplayer state
        let multiplayerActive = false;

        // UI elements
        const scoreEl = document.getElementById('score');
        const coinsEl = document.getElementById('coins');
        const badgeCoins = document.getElementById('badgeCoins');
        const coinFloat = document.getElementById('coinFloat');

        // load coins
        totalCoins = parseInt(localStorage.getItem('motoCoins')) || 0;
        updateCoinUI();

        function updateCoinUI() {
            coinsEl.innerText = totalCoins;
            badgeCoins.innerText = totalCoins;
            coinFloat.innerText = '🪙 ' + totalCoins;
            localStorage.setItem('motoCoins', totalCoins);
        }

        /* ---------- INIT 3D ---------- */
        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB);
            scene.fog = new THREE.Fog(0x87CEEB, 10, 80);

            const w = canvasContainer.clientWidth;
            const h = canvasContainer.clientHeight;

            camera = new THREE.PerspectiveCamera(70, w / h, 0.1, 1000);
            camera.position.set(0, 4.5, 9);
            camera.lookAt(0, 1.2, -5);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(w, h);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            // lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffdd99, 1.2);
            sun.position.set(10, 20, 10);
            sun.castShadow = true;
            sun.shadow.mapSize.width = 512;
            sun.shadow.mapSize.height = 512;
            scene.add(sun);

            // road
            const roadGeo = new THREE.PlaneGeometry(10, 200);
            roadGeo.rotateX(-Math.PI / 2);
            const roadMat = new THREE.MeshPhongMaterial({ color: 0x1e293b });
            const road = new THREE.Mesh(roadGeo, roadMat);
            road.position.z = -100;
            road.receiveShadow = true;
            scene.add(road);

            // road lines
            for (let i = 0; i < 40; i++) {
                const lineGeo = new THREE.PlaneGeometry(0.18, 4);
                lineGeo.rotateX(-Math.PI / 2);
                const lineMat = new THREE.MeshBasicMaterial({ color: 0x00d4ff });
                const line = new THREE.Mesh(lineGeo, lineMat);
                line.position.set(0, 0.02, -i * 6);
                scene.add(line);
            }

            // trees
            const treeGeo = new THREE.ConeGeometry(1, 3, 8);
            const treeMat = new THREE.MeshLambertMaterial({ color: 0x10b981 });
            for (let i = 0; i < 24; i++) {
                let tl = new THREE.Mesh(treeGeo, treeMat);
                tl.position.set(-7, 1.5, -i * 10);
                tl.castShadow = true;
                scene.add(tl);
                let tr = new THREE.Mesh(treeGeo, treeMat);
                tr.position.set(7, 1.5, -i * 10);
                tr.castShadow = true;
                scene.add(tr);
            }

            // Player 1 motorcycle
            motoP1 = createMoto(0x00d4ff, 0x1e293b);
            motoP1.position.set(-1.5, 0, 0);
            scene.add(motoP1);

            // Player 2 motorcycle (hidden initially)
            motoP2 = createMoto(0xff6b6b, 0x1e293b);
            motoP2.position.set(1.5, 0, 0);
            motoP2.visible = false;
            scene.add(motoP2);

            // Resize handler
            window.addEventListener('resize', () => {
                const w2 = canvasContainer.clientWidth;
                const h2 = canvasContainer.clientHeight;
                camera.aspect = w2 / h2;
                camera.updateProjectionMatrix();
                renderer.setSize(w2, h2);
            });

            // Day/night cycle
            dayTime = Math.PI / 2;
        }

        function createMoto(bodyColor, seatColor) {
            const group = new THREE.Group();

            // main body
            const body = new THREE.Mesh(
                new THREE.BoxGeometry(1.1, 0.8, 2.2),
                new THREE.MeshPhongMaterial({ color: bodyColor })
            );
            body.position.y = 0.85;
            body.castShadow = true;
            group.add(body);

            // seat
            const seat = new THREE.Mesh(
                new THREE.BoxGeometry(0.9, 0.25, 0.9),
                new THREE.MeshPhongMaterial({ color: seatColor })
            );
            seat.position.set(0, 1.25, -0.3);
            seat.castShadow = true;
            group.add(seat);

            // wheels
            const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.28, 16);
            wheelGeo.rotateZ(Math.PI / 2);
            const wheelMat = new THREE.MeshPhongMaterial({ color: 0x111111 });

            const w1 = new THREE.Mesh(wheelGeo, wheelMat);
            w1.position.set(0, 0.42, 1.1);
            w1.castShadow = true;
            group.add(w1);

            const w2 = new THREE.Mesh(wheelGeo, wheelMat);
            w2.position.set(0, 0.42, -1.1);
            w2.castShadow = true;
            group.add(w2);

            // headlight
            const light = new THREE.Mesh(
                new THREE.SphereGeometry(0.18, 8, 8),
                new THREE.MeshPhongMaterial({ color: 0xffffaa, emissive: 0xffaa00 })
            );
            light.position.set(0, 1.1, 1.2);
            group.add(light);

            return group;
        }

        /* ---------- CREATE OBSTACLE / COIN ---------- */
        function createObstacle() {
            if (!isPlaying) return;

            // obstacle (70% chance)
            if (Math.random() < 0.7) {
                const obsGroup = new THREE.Group();
                const body = new THREE.Mesh(
                    new THREE.BoxGeometry(1.6, 1.2, 3),
                    new THREE.MeshPhongMaterial({ color: 0xef4444 })
                );
                body.position.y = 0.6;
                body.castShadow = true;
                obsGroup.add(body);

                // top warning stripe
                const stripe = new THREE.Mesh(
                    new THREE.BoxGeometry(1.7, 0.15, 0.4),
                    new THREE.MeshBasicMaterial({ color: 0xfbbf24 })
                );
                stripe.position.set(0, 1.25, 0);
                obsGroup.add(stripe);

                obsGroup.position.set((Math.random() - 0.5) * 6.5, 0, -90);
                scene.add(obsGroup);
                obstacles.push(obsGroup);
            }

            // coin (65% chance)
            if (Math.random() < 0.65) {
                const coinGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.12, 16);
                coinGeo.rotateX(Math.PI / 2);
                const coinMat = new THREE.MeshPhongMaterial({
                    color: 0xf59e0b,
                    emissive: 0x78350f,
                    shininess: 80
                });
                const coin = new THREE.Mesh(coinGeo, coinMat);
                coin.position.set((Math.random() - 0.5) * 6.5, 1.1, -90);
                coin.castShadow = true;
                scene.add(coin);
                coins.push(coin);
            }
        }

        /* ---------- ANIMATE LOOP ---------- */
        function animate() {
            requestAnimationFrame(animate);

            if (isPlaying) {
                // Day/Night
                dayTime += 0.003;
                const isDay = Math.sin(dayTime) > 0;
                if (isDay) {
                    scene.background.setHex(0x87CEEB);
                    scene.fog.color.setHex(0x87CEEB);
                } else {
                    scene.background.setHex(0x0b1120);
                    scene.fog.color.setHex(0x0b1120);
                }

                // Player 1 movement
                motoP1.position.x += velocityX;
                if (motoP1.position.x > 3.2) motoP1.position.x = 3.2;
                if (motoP1.position.x < -3.2) motoP1.position.x = -3.2;

                // Player 2 movement
                if (multiplayerActive && motoP2.visible) {
                    motoP2.position.x += velocityX2;
                    if (motoP2.position.x > 3.2) motoP2.position.x = 3.2;
                    if (motoP2.position.x < -3.2) motoP2.position.x = -3.2;
                }

                // Move obstacles
                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.position.z += currentSpeed;

                    if (obs.position.z > 7) {
                        scene.remove(obs);
                        obstacles.splice(i, 1);
                        score++;
                        scoreEl.innerText = score;
                        if (score % 10 === 0) currentSpeed += 0.04;
                        continue;
                    }

                    // Collision P1
                    if (Math.abs(obs.position.x - motoP1.position.x) < 1.1 &&
                        Math.abs(obs.position.z - motoP1.position.z) < 1.6) {
                        endGame();
                        return;
                    }

                    // Collision P2
                    if (multiplayerActive && motoP2.visible &&
                        Math.abs(obs.position.x - motoP2.position.x) < 1.1 &&
                        Math.abs(obs.position.z - motoP2.position.z) < 1.6) {
                        endGame();
                        return;
                    }
                }

                // Move coins
                for (let i = coins.length - 1; i >= 0; i--) {
                    let coin = coins[i];
                    coin.position.z += currentSpeed;
                    coin.rotation.y += 0.09;

                    if (coin.position.z > 7) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                        continue;
                    }

                    // Collect P1
                    if (Math.abs(coin.position.x - motoP1.position.x) < 1.0 &&
                        Math.abs(coin.position.z - motoP1.position.z) < 1.6) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                        totalCoins++;
                        updateCoinUI();
                        continue;
                    }

                    // Collect P2
                    if (multiplayerActive && motoP2.visible &&
                        Math.abs(coin.position.x - motoP2.position.x) < 1.0 &&
                        Math.abs(coin.position.z - motoP2.position.z) < 1.6) {
                        scene.remove(coin);
                        coins.splice(i, 1);
                        totalCoins++;
                        updateCoinUI();
                    }
                }
            }

            renderer.render(scene, camera);
        }

        /* ---------- CONTROLS ---------- */
        function moveLeftP1() { velocityX = -0.14; }
        function moveRightP1() { velocityX = 0.14; }
        function stopMoveP1() { velocityX = 0; }

        function moveLeftP2() { velocityX2 = -0.14; }
        function moveRightP2() { velocityX2 = 0.14; }
        function stopMoveP2() { velocityX2 = 0; }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'a' || e.key === 'A') moveLeftP1();
            if (e.key === 'd' || e.key === 'D') moveRightP1();
            if (e.key === 'ArrowLeft') moveLeftP2();
            if (e.key === 'ArrowRight') moveRightP2();
            if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key)) {
                e.preventDefault();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.key === 'a' || e.key === 'A' || e.key === 'd' || e.key === 'D') stopMoveP1();
            if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') stopMoveP2();
        });

        /* ---------- START GAME ---------- */
        function startGame() {
            if (isPlaying) return;
            isPlaying = true;
            document.getElementById('startBtn').style.display = 'none';

            if (scene) {
                obstacles.forEach(o => scene.remove(o));
                coins.forEach(c => scene.remove(c));
                obstacles = [];
                coins = [];
            }

            multiplayerActive = document.getElementById('multiplayerMode').checked;
            motoP2.visible = multiplayerActive;

            motoP1.position.x = multiplayerActive ? -1.5 : 0;
            motoP2.position.x = 1.5;
            velocityX = 0;
            velocityX2 = 0;

            score = 0;
            currentSpeed = 0.5;
            scoreEl.innerText = score;

            totalCoins = parseInt(localStorage.getItem('motoCoins')) || 0;
            updateCoinUI();

            if (!scene) init3D();

            animate();
            clearInterval(gameInterval);
            gameInterval = setInterval(createObstacle, 850);
        }

        /* ---------- END GAME ---------- */
        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            const btn = document.getElementById('startBtn');
            btn.style.display = 'inline-block';
            btn.innerText = 'Play Again';

            let msg = 'Game Over!\nScore: ' + score + '\nCoins: ' + totalCoins;
            if (multiplayerActive) msg += '\n\n(2-Player mode)';
            setTimeout(() => alert(msg), 100);
        }

        /* ---------- BUY COINS ---------- */
        function buyCoins() {
            totalCoins += 100;
            updateCoinUI();
            const btn = document.querySelector('.shop-btn');
            btn.innerText = '✅ +100 Coins Added!';
            setTimeout(() => { btn.innerText = '🛒 Get 100 Coins (Free)'; }, 1500);
        }

        /* ---------- MODE TOGGLE ---------- */
        document.getElementById('pcMode').addEventListener('change', function() {
            if (this.checked) {
                document.getElementById('multiplayerMode').checked = false;
            }
        });

        document.getElementById('multiplayerMode').addEventListener('change', function() {
            if (this.checked) {
                document.getElementById('pcMode').checked = true;
            }
        });

    </script>
</body>
</html>
